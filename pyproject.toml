[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-safety-yolov8"
version = "0.1.0"
description = "AI-Driven Road Safety System: Real-Time Helmet Detection & Automated Number Plate Recognition (ANPR) using YOLOv8 and EasyOCR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
keywords = [
    "computer-vision",
    "yolov8",
    "helmet-detection",
    "anpr",
    "number-plate-recognition",
    "easyocr",
    "road-safety",
]
authors = [
    { name = "Teja Priyan", email = "teja1616150@gmail.com" },
]
maintainers = [
    { name = "Teja Priyan", email = "teja1616150@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.23.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "easyocr>=1.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/TejaPriyan/AI-DRIVEN-ROAD-SAFETY-SYSTEM-HELMET-DETECTION-AND-NUMBERPLATERECOGNITION-USING-YOLOV8"
Repository = "https://github.com/TejaPriyan/AI-DRIVEN-ROAD-SAFETY-SYSTEM-HELMET-DETECTION-AND-NUMBERPLATERECOGNITION-USING-YOLOV8"
"Bug Reports" = "https://github.com/TejaPriyan/AI-DRIVEN-ROAD-SAFETY-SYSTEM-HELMET-DETECTION-AND-NUMBERPLATERECOGNITION-USING-YOLOV8/issues"

[tool.setuptools]
py-modules = ["detect", "predict", "train", "val"]

[tool.pytest.ini_options]
testpaths = ["tests"]
